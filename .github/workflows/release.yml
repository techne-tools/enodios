name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          MIN_APP_VERSION=$(jq -r '.minAppVersion // empty' manifest.json)
          if [ -z "$MIN_APP_VERSION" ]; then
            MIN_APP_VERSION="1.12.3"
          fi
          echo "minAppVersion=$MIN_APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "Hermes ${{ steps.version.outputs.version }}"
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/build/main.js
            dist/build/styles.css
            manifest.json
          body: |
            ## Hermes ${{ steps.version.outputs.version }}

            **Minimum Obsidian Version:** `${{ steps.version.outputs.minAppVersion }}`

            ---

            ## 📦 Installation

            Download the release files and place them in your vault's `.obsidian/plugins/hermes/` directory:

            | File | Purpose |
            |------|---------|
            | `main.js` | Plugin code |
            | `styles.css` | Plugin styles |
            | `manifest.json` | Plugin metadata |

            Or install via [BRAT](https://obsidian.md/plugins?id=obsidian42-brat) for pre-release versions.
